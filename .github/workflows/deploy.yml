name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write functions/.env from secrets
        run: |
          {
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            echo "GOOGLE_PLACES_KEY=${{ secrets.GOOGLE_PLACES_KEY }}"
            echo "GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}"
          } > functions/.env
      - name: Install functions dependencies
        run: npm install --prefix functions
      - name: Save and check service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIA_NORTHEAST1_40722 }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_ASIA_NORTHEAST1_40722 is empty"; exit 1; fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/sa.json","utf8")); if(!j.client_email||!j.private_key){throw new Error("JSON has no client_email/private_key (service account key expected)")} console.log("service account:", j.client_email, "project:", j.project_id)' \
            || { echo "::error::The secret is not a valid service-account JSON key. Paste the whole JSON file contents (from { to })."; exit 1; }
      - name: Deploy (hosting + functions + firestore rules)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools deploy --project asia-northeast1-40722 --non-interactive
