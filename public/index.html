<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行きたい場所">
<meta name="theme-color" content="#1f7a6d">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>ふたりの行きたい場所</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5f2ec;--card:#fffdf9;--ink:#1d2a2c;--sub:#7b8587;--line:#e7e1d6;--accent:#1f7a6d;--accent-soft:#dcefe9;--warm:#f2a65a;--warm-soft:#fdebd6;--danger:#c4513f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:500;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 0 8px}
.top{display:flex;align-items:center;gap:6px}
.top h1{flex:1;font-size:19px;margin:0;letter-spacing:.02em}
.ib{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative}
.ib:active{background:var(--line)}
.ib svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--warm);display:none}
.ib.act .dot{display:block}
#status{font-size:12px;color:var(--sub);min-height:16px;margin:2px 2px 6px}
#searchRow{display:none;margin:4px 0 6px}
#searchRow.on{display:block}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:64px;resize:vertical}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;gap:3px;margin:6px 0 4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:11px;font-size:14px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px #0001}
.banner{background:var(--warm-soft);border-radius:14px;padding:10px 14px;font-size:13px;margin:8px 0}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;cursor:pointer}
.item:active{transform:scale(.99)}
.tile{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.item .b{flex:1;min-width:0}
.item h3{margin:0;font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ad{font-size:12.5px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.done{background:#e6e3f7;color:#5a4fb0}.tag.new{background:var(--warm);color:#fff}.tag.re{background:var(--warm-soft);color:#a8661c}.tag.pv{background:#e9ecee;color:#566}
.month{font-size:13px;color:var(--sub);font-weight:700;margin:20px 2px 0}
.empty{text-align:center;color:var(--sub);padding:56px 12px;font-size:14px;line-height:1.8}
.empty b{display:block;font-size:34px;margin-bottom:8px}
/* マップ */
#mapWrap{display:none;position:relative;margin:8px -16px 0;height:calc(100vh - 230px);min-height:340px}
#map{position:absolute;inset:0;border-radius:0}
.mapbtns{position:absolute;left:12px;bottom:92px;z-index:400;display:flex;gap:8px}
.mapbtns button{border:0;border-radius:99px;background:#1d2a2cdd;color:#fff;padding:9px 14px;font-size:13px;cursor:pointer}
.pin{width:46px;height:46px;border-radius:50%;background:#fff;border:4px solid var(--c,var(--accent));box-shadow:0 3px 10px #0004;display:grid;place-items:center;font-size:22px;overflow:hidden}
.pin{position:relative;overflow:visible}
.pin .pi{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.pin .bd{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--c);font-size:12px;display:grid;place-items:center}
.pin.dn{opacity:.75}
.pin.pv{border-style:dashed}
.mleg{position:absolute;left:10px;top:10px;z-index:500;background:#fffdf9ee;border-radius:12px;padding:6px 10px;font-size:11px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 8px #0003}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pin img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));background:#fffdf9ee;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:8px 6px;box-shadow:0 8px 28px #0002;z-index:600}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);padding:4px 10px;cursor:pointer}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:700}
nav .plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;margin-top:-26px;padding:0;justify-content:center;box-shadow:0 6px 16px #1f7a6d66}
nav .plus svg{stroke:#fff;width:26px;height:26px}
#ov{position:fixed;inset:0;background:#0007;z-index:700;display:none}
#ov.on{display:block}
#sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));z-index:800;transition:transform .22s ease}
#sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#sheet h2{font-size:18px;margin:4px 0 12px}
.lbl{font-size:12px;color:var(--sub);margin:16px 2px 8px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:0;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font-weight:700;width:100%;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.6}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.warn{background:#fbe5e1;color:var(--danger)}
.stack>*{margin-top:10px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.links a{font-size:14px;text-decoration:none;color:var(--accent);background:var(--accent-soft);padding:9px 14px;border-radius:12px;font-weight:600}
.memo{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.6;margin:10px 0}
.meta{font-size:12px;color:var(--sub)}
.code{font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;background:var(--accent-soft);padding:10px;border-radius:10px}
.hidden{display:none!important}
.cand{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;cursor:pointer}
.cand input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.cand b{font-size:15px}
.hero{width:100%;height:160px;border-radius:16px;object-fit:cover;margin-bottom:12px;background:var(--accent-soft)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>ふたりの行きたい場所</h1>
    <button class="ib" id="bRoom" aria-label="スペース切替"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 2 4 5"/></svg></button>
    <button class="ib" id="bSearch" aria-label="検索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="ib" id="bFilter" aria-label="絞り込み"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><i class="dot"></i></button>
  </div>
  <div id="searchRow"><input class="field" id="q" placeholder="名前・住所・メモで検索"></div>
  <div id="status"></div>
  <div class="seg" id="scope"><button data-v="shared" class="on">👫 ふたりで共有</button><button data-v="priv">🔒 自分だけ</button></div>
</header>

<main id="main"></main>
<div id="mapWrap">
  <div id="map"></div>
  <div class="mapbtns"><button id="mFit">全体表示</button><button id="mLoc">現在地</button><span id="mInfo" style="align-self:center;font-size:12px;background:#fffdf9ee;padding:5px 10px;border-radius:99px"></span></div>
</div>

<nav id="nav">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>ホーム</button>
  <button data-t="map"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>マップ</button>
  <button class="plus" data-t="add" aria-label="追加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>思い出</button>
  <button data-t="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>設定</button>
</nav>

<div id="ov"></div>
<div id="sheet"><div class="grab"></div><div id="sb"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

// ▼ Firebaseコンソールの「プロジェクトの設定 > マイアプリ」にある設定をここに貼る
// ※ authDomain は、コンソールに表示された値(○○.firebaseapp.com)のままにしてください
const firebaseConfig = {
  apiKey: "AIzaSyCWBGmFhds01LqT2Rx-sqjSKLohEwAjvLk",
  authDomain: "asia-northeast1-40722.firebaseapp.com",
  projectId: "asia-northeast1-40722",
  appId: "1:592024151681:web:1cbf9a44d6a8a941200f80",
};

const app = initializeApp(firebaseConfig);
const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence], popupRedirectResolver: browserPopupRedirectResolver });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
const inApp = /Line\/|Instagram|FBAN|FBAV|MicroMessenger|TikTok|musical_ly|Twitter|Snapchat/i.test(navigator.userAgent);
const fs = getFirestore(app);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const CATS = ["ごはん", "カフェ", "旅行", "おでかけ", "その他"];
const CATCOL = { "ごはん": "#e8833a", "カフェ": "#9a6b3f", "旅行": "#1f9d8a", "おでかけ": "#7a5de0", "その他": "#7b8794" };
const ICON = { "ごはん": ["🍽️", "#fdebd6"], "カフェ": ["☕", "#efe3d3"], "旅行": ["🧳", "#dcefe9"], "おでかけ": ["🎡", "#e6e3f7"], "その他": ["📍", "#e9ecee"] };
const REACT = ["イマイチ", "良いね", "また行きたい"];
const SORTS = { new: "新しい順", old: "古い順", name: "名前順" };
const safeImg = (u) => (/^https:\/\//.test(u || "") ? u : "");

let shared = [], priv = [], spots = [], uid = null, room = null, unsubShared = null, unsubPriv = null, unsubRooms = null, rooms = [], members = [], meta = null, unsubMem = null, unsubMeta = null, dates = [], unsubDates = null;
let tab = "home", scope = "shared", q = "", fSt = "all", fCat = "all", fRe = "all", fTag = "all", sort = "new", who = ls.get("who", "");
let addState = { thumb: "", lat: null, lng: null, mapsUrl: "", isPriv: false, cat: "ごはん", cands: [] };
// 共有ボタン・ショートカットから渡されたURL(?add= / ?url= / ?text=)を覚えておく
try {
  const sp = new URLSearchParams(location.search);
  const raw = [sp.get("add"), sp.get("url"), sp.get("text")].filter(Boolean).join(" ");
  const m = raw.match(/https?:\/\/[^\s<>"']+/);
  if (m) { ls.set("pendingShare", m[0]); setTimeout(() => { const st = document.getElementById("status"); if (st) st.textContent = "共有されたURLを受け取りました"; }, 300); }
  else if (sp.has("add") || sp.has("url") || sp.has("text")) setTimeout(() => { const st = document.getElementById("status"); if (st) st.textContent = "共有されたURLが空でした(ショートカットを確認)"; }, 300);
} catch {}
const prevSeen = ls.get("lastSeen", 0);
const markSeen = () => ls.set("lastSeen", Date.now());
document.addEventListener("visibilitychange", () => document.hidden && markSeen());
const randCode = () => Array.from(crypto.getRandomValues(new Uint8Array(24)), (b) => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
const fail = (m) => { $("status").textContent = m; const a = document.getElementById("aMsg"); if (a) a.textContent = m; };

/* ---------- 保存先 ---------- */
const sharedCol = () => collection(fs, "rooms", room, "spots");
const privCol = () => collection(fs, "users", uid, "spots");
const refOf = (s) => (s.private ? doc(privCol(), s.id) : doc(sharedCol(), s.id));
function clean(s) { const { private: p, id, ...d } = s; return d; }
async function save(s) { await setDoc(refOf(s), s.private ? { ...clean(s), private: true } : { ...clean(s), by: s.by || uid }); }
async function remove(s) { await deleteDoc(refOf(s)); }
async function moveSpot(s, toPrivate) {
  const d = clean(s);
  if (toPrivate) { await setDoc(doc(privCol(), s.id), { ...d, private: true }); await deleteDoc(doc(sharedCol(), s.id)); }
  else { await setDoc(doc(sharedCol(), s.id), { ...d, private: false, by: d.by || uid }); await deleteDoc(doc(privCol(), s.id)); }
}
function rebuild() { spots = [...shared, ...priv.map((p) => ({ ...p, private: true }))]; render(); }

/* ---------- ルーム(複数) ---------- */
const roomsCol = () => collection(fs, "users", uid, "rooms");
const roomName = (c) => (rooms.find((r) => r.id === c) || {}).name || "共有スペース";
const inviteLink = (c) => location.origin + location.pathname + "?room=" + c + "&n=" + encodeURIComponent(roomName(c));
async function addRoom(code, name) {
  if (!rooms.some((r) => r.id === code)) { rooms.push({ id: code, name }); }
  await setDoc(doc(roomsCol(), code), { name, createdAt: Date.now() }, { merge: true });
}
async function onRoomGone(code, why) {
  try { await deleteDoc(doc(roomsCol(), code)); } catch {}
  rooms = rooms.filter((x) => x.id !== code);
  if (room !== code) { render(); return; }
  if (unsubShared) unsubShared(); if (unsubMem) unsubMem(); if (unsubMeta) unsubMeta(); if (unsubDates) unsubDates(); dates = [];
  room = null; shared = []; members = []; meta = null; ls.set("room", null); rebuild();
  locked = false; closeSheet();
  if (rooms.length) { openRoom(rooms[0].id); fail(why); } else { roomPicker(); fail(why); }
}
function handleShare() {
  const u = ls.get("pendingShare", null); if (!u) return;
  let n = 0;
  const go = () => {
    if (!room || !uid) { if (n++ < 20) setTimeout(go, 500); return; }
    locked = false; openAdd();
    const el = $("aUrl");
    if (!el) { if (n++ < 20) setTimeout(go, 500); return; }
    el.value = u;
    ls.set("pendingShare", null);
    autofill();
  };
  go();
}
function openRoom(code) {
  if (code.length < 16) { ls.set("room", null); fail("古い形式のスペースは使えません。新しい招待リンクから入り直してください"); roomPicker(); return; }
  room = code; ls.set("room", code);
  history.replaceState(null, "", location.pathname);
  if (unsubShared) unsubShared();
  shared = []; members = []; meta = null; rebuild();
  if (unsubMem) unsubMem(); if (unsubMeta) unsubMeta(); if (unsubDates) unsubDates(); dates = [];
  unsubDates = onSnapshot(collection(fs, "rooms", code, "dates"), (sn) => { dates = sn.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  setDoc(doc(fs, "rooms", code, "members", uid), { name: who || "名無し", joinedAt: Date.now() }, { merge: true }).catch((e) => fail("参加者の登録に失敗: " + e.message));
  unsubMem = onSnapshot(collection(fs, "rooms", code, "members"), (s) => { members = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((x, y) => (x.joinedAt || 0) - (y.joinedAt || 0)); refreshMembers(); }, (e) => fail("参加者を読み込めませんでした: " + e.message));
  unsubMeta = onSnapshot(doc(fs, "rooms", code), (s) => { meta = s.exists() ? s.data() : null; if (meta && meta.deleted) { onRoomGone(code, "「" + roomName(code) + "」は作成者によって削除されました"); return; } refreshMembers(); }, () => {});
  unsubShared = onSnapshot(sharedCol(), (snap) => { shared = snap.docs.map((d) => ({ ...d.data(), id: d.id, private: false })); rebuild(); }, (e) => fail("読み込めませんでした: " + e.message));
  render();
  setTimeout(handleShare, 600);
}
function roomPicker() {
  const list = rooms.map((r) => `<div class="cand" style="cursor:default"><div style="flex:1"><b>${esc(r.name)}</b>${r.id === room ? ' <span class="meta">(表示中)</span>' : ""}</div>
    ${r.id === room ? "" : `<button class="btn soft" style="width:auto;margin:0;padding:8px 14px" data-ra="open" data-c="${r.id}">開く</button>`}
    <button class="btn soft" style="width:auto;margin:0 0 0 6px;padding:8px 14px" data-ra="inv" data-c="${r.id}">招待</button></div>`).join("");
  openSheet(`<h2>共有スペース</h2>
  <p style="margin-top:0;color:var(--sub);font-size:14px">スペースは何個でも作れます(例:彼女と、友だちと、家族と)。スペースごとに招待した人だけが入れます。</p>
  ${list ? `<div class="lbl">あなたのスペース</div>${list}` : ""}
  <div class="lbl">新しく作る</div>
  <input class="field" id="rName" placeholder="スペース名(例:彼女と / 大阪旅行)">
  <button class="btn" id="rNew">作って招待リンクを出す</button>
  <div class="lbl">招待を受け取った</div>
  <div class="meta" style="margin:0 2px 8px">届いたリンクを開けば自動で参加します。開けないときはここに貼ってください。</div>
  <input class="field" id="rCode" placeholder="数字12桁の招待コード or 招待リンク">
  <button class="btn soft" id="rJoin">参加する</button>
  ${rooms.length ? '<button class="btn soft" id="rClose">閉じる</button>' : ""}`, !rooms.length);
}
const fmtCode = (d) => d.replace(/(\d{4})(?=\d)/g, "$1-");
const randDigits = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b % 10).join("");
async function inviteSheet(code) {
  const link = inviteLink(code);
  openSheet(`<h2>「${esc(roomName(code))}」に招待</h2>
  <p style="margin-top:0;color:var(--sub);font-size:14px">相手に<b>数字の招待コード</b>を伝えるか、リンクを送ってください。コードは<b>7日間</b>有効です。</p>
  <div class="lbl" style="margin-top:0">数字の招待コード(12桁)</div>

let map = null, layer = null, meDot = null;
function renderMap() {
  if (typeof L === "undefined") { $("mInfo").textContent = "地図を読み込めませんでした"; return; }
  if (!map) {
    map = L.map("map", { zoomControl: false }).setView([36.2, 138.2], 5);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(() => { map.invalidateSize(); drawPins(true); }, 50);
}
function drawPins(fit) {
  layer.clearLayers();
  const a = visible(false), pts = [];
  let none = 0;
  a.forEach((s) => {
    if (typeof s.lat !== "number" || typeof s.lng !== "number") { none++; return; }
    const [ic] = ICON[s.cat] || ICON["その他"], im = safeImg(s.thumb), col = CATCOL[s.cat] || CATCOL["その他"];
    const html = `<div class="pin ${s.private ? "pv" : ""} ${s.done ? "dn" : ""}" style="--c:${col}"><div class="pi" style="background:${(ICON[s.cat] || ICON["その他"])[1]}">${im ? `<img src="${esc(im)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${ic}'))">` : ic}</div><span class="bd">${ic}</span></div>`;
    const m = L.marker([s.lat, s.lng], { icon: L.divIcon({ html, className: "", iconSize: [46, 46], iconAnchor: [23, 23] }) }).addTo(layer);
    m.on("click", () => openDetail(s.id, s.private));
    pts.push([s.lat, s.lng]);
  });
  const lg = document.getElementById("mLeg") || (() => { const d = document.createElement("div"); d.id = "mLeg"; d.className = "mleg"; $("map").parentNode.insertBefore(d, $("map").nextSibling); return d; })();
  lg.innerHTML = Object.keys(CATCOL).map((k) => `<span><i style="background:${CATCOL[k]}"></i>${k}</span>`).join("");
  $("mInfo").textContent = `${pts.length}件を表示` + (none ? `(座標なし ${none}件)` : "");
  if (fit && pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 15 });
}
$("mFit").onclick = () => drawPins(true);
$("mLoc").onclick = () => {
  if (!map) return;
  map.locate({ setView: true, maxZoom: 15 });
  map.once("locationfound", (e) => { if (meDot) meDot.remove(); meDot = L.circleMarker(e.latlng, { radius: 8, color: "#fff", weight: 3, fillColor: "#2f7de1", fillOpacity: 1 }).addTo(map); });

}
async function runParse(body, btn, label) {
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  fail("読み込んでいます…");
  try {
    const j = await api(body);
    if (j.url) $("aUrl").value = j.url;
    if (j.thumb) addState.thumb = j.thumb;
    addState.cands = []; addState.caption = j.caption || "";
    if (j.spots && j.spots.length > 1) {
      addState.cands = j.spots;
      fail(`${j.spots.length}件のスポットが見つかりました。追加するものを選んでください`);
    } else {
      if (j.name) $("aName").value = j.name;
      if (j.address) $("aAddr").value = j.address;
      if (j.caption) $("aMemo").value = j.caption; else if (j.memo) $("aMemo").value = j.memo;
      if (CATS.includes(j.cat)) { addState.cat = j.cat; [...$("aCat").children].forEach((c) => c.classList.toggle("on", c.dataset.c === j.cat)); }
      Object.assign(addState, { lat: j.lat, lng: j.lng, mapsUrl: j.mapsUrl || "" });
      if (!j.name) { addState.caption = j.caption || ""; if (!$("aName").value.trim()) $("aName").value = fallbackName(); $("aName").focus(); }
      fail(j.name ? (j.fromImage ? "画像の文字から見つけました。確認して「追加する」を押してください" : "読み込みました。確認して「追加する」を押してください") : "店名は見つかりませんでした" + (j.aiError ? "(" + j.aiError + ")" : "") + "。メモに文章を足したり直したりして「メモの内容から場所を読み取る」を押すか、店名を入力して「検索」を押してください");
    }
    renderCands();
  } catch (e) { fail("読み込めませんでした(" + e.message + ")"); }
  if (btn) { btn.disabled = false; btn.textContent = label; }
}

  openSheet(`<h2>ログイン</h2>
  <p style="margin-top:0;color:var(--sub);font-size:14px;line-height:1.7">Googleアカウントでログインすると、スマホを変えてもブラウザのデータを消しても、同じデータに戻れます。</p>
  ${inApp ? `<div class="banner" style="margin:0 0 10px">⚠️ LINEなどのアプリ内ブラウザで開いています。ここだと毎回ログインが必要になります。右上の「…」から<b>「Safariで開く」</b>を選んでください。</div>` : ""}
  <button class="btn" id="gLogin">Googleでログイン</button>
  <div class="meta" style="margin:10px 2px">毎回ログインを求められるときは、<b>Safariで開く</b>/プライベートブラウズをやめる/「ホーム画面に追加」して、そのアイコンから開くと、ログインが残りやすくなります。</div>`, true);
}
async function googleLogin() {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth, provider);
    else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") fail("ログインできませんでした: " + (e.code || e.message));
  }
}
getRedirectResult(auth).catch((e) => fail("ログインできませんでした: " + (e.code || e.message)));
/* ---------- 自動アップデート(ホーム画面アプリ用) ---------- */
(function () {
  let busy = false;
  const hash = (t) => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h >>> 0); };
  async function check() {
    if (busy) return; busy = true;
    try {
      const r = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const h = hash(await r.text()), cur = ls.get("htmlHash", null);
      ls.set("htmlHash", h);
      if (cur && cur !== h && !locked) { location.replace(location.pathname + "?v=" + h); }
    } catch {} finally { busy = false; }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  setTimeout(check, 1500);
})();

onAuthStateChanged(auth, (u) => {
  if (!u) {
    uid = null; shared = []; priv = []; room = null; rooms = [];
    if (unsubShared) unsubShared(); if (unsubPriv) unsubPriv(); if (unsubRooms) unsubRooms();
    rebuild(); loginSheet(); return;
  }
  locked = false; closeSheet();
  uid = u.uid;
  if (!who && u.displayName) { who = u.displayName.split(/\s/)[0]; ls.set("who", who); }
  if (unsubPriv) unsubPriv();
  unsubPriv = onSnapshot(collection(fs, "users", uid, "spots"), (snap) => { priv = snap.docs.map((d) => ({ ...d.data(), id: d.id })); rebuild(); }, () => {});
  const params = new URLSearchParams(location.search);
  const urlRoom = params.get("room"), urlName = params.get("n");
  if (unsubRooms) unsubRooms();
  let first = true;
  unsubRooms = onSnapshot(roomsCol(), async (snap) => {
    rooms = snap.docs.map((d) => ({ id: d.id, name: d.data().name || "共有スペース", createdAt: d.data().createdAt || 0 })).sort((x, y) => x.createdAt - y.createdAt);
    // 古い形式(15文字以下)のコードは使えないので、一覧から自動で外す
    rooms.filter((x) => x.id.length < 16).forEach((x) => deleteDoc(doc(roomsCol(), x.id)).catch(() => {}));
    rooms = rooms.filter((x) => x.id.length >= 16);
    if (first) {
      first = false;
      const saved = ls.get("room", null);
      if (urlRoom && urlRoom.length >= 16) { if (!rooms.some((r) => r.id === urlRoom)) await addRoom(urlRoom, urlName || "共有スペース"); openRoom(urlRoom); }
      else if (saved && saved.length >= 16) { if (!rooms.some((r) => r.id === saved)) await addRoom(saved, "ふたりのスペース"); openRoom(saved); }
      else if (rooms.length) openRoom(rooms[0].id);
      else roomPicker();
    } else render();
  }, () => { const code = urlRoom || ls.get("room", null); if (code) openRoom(code); else roomPicker(); });
});
render();
</script>
